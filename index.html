    /* Portfolio: compact, readable asset cards */
    .portfolio-metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 14px}
    .portfolio-metrics .metric{min-height:108px;padding:15px 17px}
    .portfolio-metrics .metric-value{font-size:20px;margin:9px 0 4px}
    .portfolio-list{display:grid;gap:10px}
    .portfolio-item{padding:15px 17px;box-shadow:none}
    .portfolio-item-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
    .portfolio-symbol{font:800 17px Manrope;display:flex;align-items:center;gap:9px}
    .portfolio-symbol .tag{font:700 9px 'DM Sans',sans-serif}
    .portfolio-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
    .portfolio-values>div{min-width:0;display:grid;gap:4px}
    .portfolio-values span{font-size:10px;color:var(--muted)}
    .portfolio-values strong{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .portfolio-item-foot{border-top:1px solid #263950;margin-top:12px;padding-top:9px;color:var(--muted);font-size:10px}
    .portfolio-note{margin-top:12px;line-height:1.6}
    @media(max-width:760px){.portfolio-metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}.portfolio-values{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.portfolio-item{padding:14px}.portfolio-symbol{font-size:16px}}
    @media(max-width:520px){.portfolio-metrics{grid-template-columns:1fr!important}}

    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}img,video,canvas{max-width:100%;height:auto}iframe,embed,object{max-width:100%}.menu-toggle{display:none}
    @media(max-width:1080px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.app{grid-template-columns:220px 1fr}.main{padding:22px}}
    @media(max-width:760px){.app{display:block}.sidebar{position:sticky;top:0;height:auto;z-index:10;padding:10px 12px;border-right:0;border-bottom:1px solid #263950;display:block}.side-brand{border:0;padding:0 4px 8px}.side-brand .brand-mark{width:34px;height:34px;font-size:12px}.side-brand strong{font-size:10px}.nav-wrap{overflow:auto}.nav{display:flex;gap:5px;min-width:max-content}.nav-label,.side-bottom{display:none}.nav button{width:auto;padding:9px 10px;font-size:10px}.main{padding:19px 14px 40px}.topbar{margin-bottom:18px}.topbar h1{font-size:20px}.date-pill{display:none}.metrics{gap:9px}.metric{padding:13px;min-height:112px}.metric-value{font-size:19px}.metric-top{font-size:10px}.columns{gap:10px}.card{padding:14px}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.auth-card{padding:25px}}
    @media(max-width:760px){
      body{font-size:16px}
      /* Collapsible navigation */
      .sidebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 12px;padding:8px 12px}
      .side-brand{padding:0 4px;min-width:0}.side-brand strong{font-size:12px}.side-brand span{font-size:10px}
      .menu-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;border:1px solid #33455b;border-radius:10px;background:#142236;color:#e3eaf2;font-size:16px;font-weight:600}
      .menu-toggle .bars{position:relative;width:18px;height:2px;background:currentColor;border-radius:2px;transition:.18s}
      .menu-toggle .bars::before,.menu-toggle .bars::after{content:'';position:absolute;left:0;width:18px;height:2px;background:currentColor;border-radius:2px;transition:.18s}
      .menu-toggle .bars::before{top:-6px}.menu-toggle .bars::after{top:6px}
      .sidebar.menu-open .menu-toggle .bars{background:transparent}
      .sidebar.menu-open .menu-toggle .bars::before{top:0;transform:rotate(45deg)}
      .sidebar.menu-open .menu-toggle .bars::after{top:0;transform:rotate(-45deg)}
      .nav-wrap,.side-bottom{display:none;flex:1 0 100%}
      .sidebar.menu-open{max-height:100vh;max-height:100dvh;overflow-y:auto}
      .sidebar.menu-open .nav-wrap{display:block;overflow:visible;padding-top:10px}
      .sidebar.menu-open .side-bottom{display:block;margin-top:10px;padding:14px 4px 6px}
      .sidebar.menu-open .nav{display:grid;gap:4px;min-width:0}
      .nav button{width:100%;min-height:48px;padding:10px 12px;font-size:16px}
      .user-chip strong{font-size:15px}.user-chip small{font-size:13px}.avatar{width:40px;height:40px}
      /* Readable text */
      .small,.breadcrumb,.card-sub,.metric-foot,.metric-top,.subsymbol,.field label,.auth-foot,.toast,.eyebrow,.page-head p,.alloc-name,.alloc-val{font-size:14px}
      .eyebrow{letter-spacing:1.5px}.status-pill{font-size:12px}
      .auth-card p,.notice,.callout,.modal p,td,.table-empty,.toast{font-size:16px}
      th{font-size:12px}.tag{font-size:12px;display:inline-block}
      .card-head h3{font-size:17px}.page-head h2{font-size:20px}
      /* Tap targets and inputs (16px inputs also stop iOS zooming in) */
      .btn,.btn.small-btn{min-height:44px;min-width:44px;font-size:16px;padding:10px 14px}
      .link-btn{min-height:44px;display:inline-flex;align-items:center;font-size:15px}
      .field input,.field select,.field textarea,.toolbar input,.toolbar select{font-size:16px;min-height:44px}
      .btn:hover{transform:none}
      /* Prevent sideways overflow */
      .topbar{flex-wrap:wrap}.topbar>div:first-child{min-width:0}.top-actions{flex-wrap:wrap}
      .card-head{flex-wrap:wrap}.card-head>div:first-child{min-width:0;flex:1 1 200px}
      .page-head .btn{width:100%}
      .two-col{grid-template-columns:1fr}
      .metrics[style]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      .metric-value{overflow-wrap:anywhere;font-size:20px}
      .metric>*,.card>*,.profile-card>*{min-width:0}
      .profile-card{flex-wrap:wrap}.profile-card .subsymbol,.two-col strong,.user-chip strong{overflow-wrap:anywhere}
      .table-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
      .auth-shell{padding:16px}.auth-foot{flex-wrap:wrap;gap:4px 12px}.auth-card h1{font-size:25px}
      .modal-backdrop{padding:12px}.modal{padding:18px;max-height:calc(100dvh - 24px)}.modal h3{font-size:19px}
      .modal-actions{flex-wrap:wrap}.modal-actions .btn{flex:1 1 120px}
      .toast{left:12px;right:12px;bottom:12px;max-width:none}
    }
    @media(max-width:520px){.metrics,.metrics[style]{grid-template-columns:1fr!important}.metric{min-height:0}}
    @media(max-width:390px){.metrics{grid-template-columns:1fr}.top-actions .status-pill{display:none}}
    @media print{body{background:white;color:#111}.sidebar,.top-actions,.toolbar,.btn,.nav-wrap{display:none!important}.app{display:block}.main{padding:0;max-width:none}.card,.metric{background:white;border:1px solid #ddd;box-shadow:none;color:#111;break-inside:avoid}.muted,.card-sub,.metric-foot{color:#555}.metric-value,td,th,.symbol{color:#111}.print-only{display:block}.table-wrap{overflow:visible}table{min-width:0}td,th{font-size:9px;padding:7px}}

<body>
  <div id="root">
    <div class="auth-shell"><div class="auth-card"><div class="brand-row"><div class="brand-mark">AAI</div><div><div class="eyebrow">PRIVATE INVESTMENT OFFICE</div><div style="font:700 12px Manrope;margin-top:4px">PT. Adhinatha Amanah Investama</div></div></div><h1>Investment Intelligence.</h1><p>Portal investasi eksklusif untuk memantau portofolio, transaksi, dan laporan investor.</p><div class="notice">Menghubungkan ke ruang investasi AAI…</div></div></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.119.0';
    const cfg = window.AAI_CONFIG || {};
    const supabase = createClient(cfg.supabaseUrl, cfg.supabasePublishableKey, { auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true} });
    const root = document.getElementById('root');
    const modalRoot = document.getElementById('modal-root');
    let currentUser=null, profile=null, data={}, activePage='overview', authMode='login', busy=false;
    const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
    const num = n => new Intl.NumberFormat('id-ID',{maximumFractionDigits:4}).format(Number(n||0));
    const dateFmt = v => v ? new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const isAdmin = () => profile?.role==='admin' && profile?.status==='active';
    const notify = (msg,err=false) => { const el=document.getElementById('toast-root'); el.innerHTML=`<div class="toast ${err?'error':''}">${esc(msg)}</div>`; setTimeout(()=>el.innerHTML='',4200); };
    const initials = s => (s||'AA').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const titleMap={overview:'Overview',portfolio:'Portfolio',transactions:'Transaction Ledger',dividends:'Dividend Ledger',investors:'Investor Relations',distributions:'Profit Sharing',documents:'Documents & Reports',profile:'My Account'};
    function renderAuth(message='',error=false){
      const recovery=authMode==='update-password';
      const heading=authMode==='login'?'Welcome back.':authMode==='signup'?'Create access.':recovery?'Buat password baru.':'Reset password.';
      const intro=authMode==='login'?'Masuk ke portal investasi Anda.':authMode==='signup'?'Pendaftaran akun pertama untuk menyiapkan akses admin. Akun baru akan menunggu aktivasi perusahaan.':recovery?'Tautan reset telah diverifikasi. Buat password baru untuk akun Anda.':'Masukkan email untuk menerima tautan reset password.';
      let form='';
      if(recovery){
        form='<form id="auth-form"><div class="field"><label>Password baru</label><input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter"></div><div class="field"><label>Ulangi password baru</label><input name="password_confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Ulangi password"></div><button class="btn full" type="submit">Simpan password baru</button></form>';
      }else if(authMode==='reset'){
        form='<form id="auth-form"><div class="field"><label>Email perusahaan</label><input name="email" type="email" required autocomplete="email" placeholder="nama@email.com"></div><button class="btn full" type="submit">Kirim tautan reset</button></form><div class="auth-foot"><button class="link-btn" data-auth="login">Kembali ke login</button></div>';
      }else{
        form='<form id="auth-form">'+(authMode==='signup'?'<div class="field"><label>Nama lengkap</label><input name="full_name" required autocomplete="name" placeholder="Nama lengkap"></div>':'')+'<div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="nama@email.com"></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="8" autocomplete="'+(authMode==='login'?'current-password':'new-password')+'" placeholder="Minimal 8 karakter"></div><button class="btn full" type="submit">'+(authMode==='login'?'Masuk ke dashboard':'Daftar akun')+'</button></form>'+'<div class="auth-foot">'+(authMode==='login'?'<button class="link-btn" data-auth="reset">Lupa password?</button><button class="link-btn" data-auth="signup">Aktivasi admin pertama</button>':'<button class="link-btn" data-auth="login">Sudah punya akun? Login</button><span>AAI Secure Portal</span>')+'</div>';
      }
      root.innerHTML='<div class="auth-shell"><div class="auth-card"><div class="brand-row"><div class="brand-mark">AAI</div><div><div class="eyebrow">PRIVATE INVESTMENT OFFICE</div><div style="font:700 12px Manrope;margin-top:4px">PT. Adhinatha Amanah Investama</div></div></div><h1>'+heading+'</h1><p>'+intro+'</p>'+(message?'<div class="notice '+(error?'error':'')+'">'+esc(message)+'</div>':'')+form+'</div></div>';
      root.querySelectorAll('[data-auth]').forEach(b=>b.addEventListener('click',()=>{authMode=b.dataset.auth;renderAuth()}));
      root.querySelector('#auth-form').addEventListener('submit',handleAuthSubmit);
    }
    async function handleAuthSubmit(e){
      e.preventDefault(); if(busy)return; busy=true; const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;
      const fd=new FormData(e.currentTarget); const email=String(fd.get('email')||'').trim().toLowerCase();
      try{
        if(authMode==='update-password'){
          const password=String(fd.get('password')||''),confirmation=String(fd.get('password_confirm')||'');
          if(password.length<8)throw new Error('Password minimal 8 karakter.');
          if(password!==confirmation)throw new Error('Konfirmasi password tidak sama.');
          const {error}=await supabase.auth.updateUser({password});if(error)throw error;
          await supabase.auth.signOut();currentUser=null;profile=null;history.replaceState(null,'',location.pathname+location.search);authMode='login';renderAuth('Password berhasil diperbarui. Silakan login menggunakan password baru.');
        }else if(authMode==='login'){
          const {error}=await supabase.auth.signInWithPassword({email,password:fd.get('password')}); if(error)throw error; await refreshApp();
        }else if(authMode==='signup'){
          const {data:res,error}=await supabase.auth.signUp({email,password:fd.get('password'),options:{data:{full_name:fd.get('full_name')}}});if(error)throw error;
          if(res.session){await supabase.auth.signOut()};renderAuth('Pendaftaran berhasil. Akun menunggu aktivasi admin. Untuk admin pertama, aktifkan role melalui SQL setup di README aplikasi.');
        }else{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error)throw error;renderAuth('Tautan reset password telah diminta. Periksa email Anda.');}
      }catch(err){renderAuth(err.message||'Terjadi kesalahan autentikasi.',true)}finally{busy=false;}
    }
    async function refreshApp(){
      const {data:s}=await supabase.auth.getSession(); currentUser=s.session?.user||null;
      if(!currentUser){profile=null;renderAuth();return}
      const {data:p,error}=await supabase.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
      if(error)throw error;profile=p;
      if(!profile||profile.status!=='active') { await supabase.auth.signOut();currentUser=null;profile=null;authMode='login';renderAuth('Akun belum aktif. Hubungi admin PT. Adhinatha Amanah Investama untuk aktivasi.',true);return; }
      await loadData(); renderApp();
    }
    async function loadData(){
      const transactionQuery=supabase.from('portfolio_transactions').select('*');
      if(!isAdmin())transactionQuery.or(`investor_id.eq.${profile.id},investor_id.is.null`);
      const queries=[
        supabase.from('portfolio_positions_derived').select('*').order('market').order('symbol'),
        transactionQuery.order('trade_date',{ascending:false}).limit(250),
        supabase.from('investor_capital_movements').select('*').order('movement_date',{ascending:false}).limit(250),
        supabase.from('profit_allocations').select('*').order('created_at',{ascending:false}).limit(100),
        supabase.from('investor_documents').select('*').order('created_at',{ascending:false}).limit(100),
        supabase.from('portfolio_snapshots').select('*').order('snapshot_date',{ascending:true}).limit(24),
        supabase.from('portfolio_dividends').select('*').order('payment_date',{ascending:false}).limit(250)
      ];
      if(isAdmin())queries.push(supabase.from('profiles').select('*').order('created_at',{ascending:false}),supabase.from('profit_distributions').select('*').order('created_at',{ascending:false}).limit(100));
      else queries.push(Promise.resolve({data:[profile],error:null}),Promise.resolve({data:[],error:null}));
      const results=await Promise.all(queries); for(const r of results)if(r.error)throw r.error;
      [data.positions,data.transactions,data.capital,data.allocations,data.documents,data.snapshots,data.dividends,data.investors,data.distributions]=results.map(r=>r.data||[]);
    }
    function totals(){
      const activeInvestors=(data.investors||[]).filter(p=>p.role==='investor'&&p.status==='active');
      const capital=(data.capital||[]).reduce((s,r)=>s+(r.movement_type==='deposit'?1:-1)*Number(r.amount_idr),0);
      const pricedPositions=(data.positions||[]).filter(p=>p.market_price!==null&&p.market_price!==undefined&&Number(p.market_price)>0);
      const unpricedCount=(data.positions||[]).length-pricedPositions.length;
      const value=pricedPositions.reduce((s,p)=>s+Number(p.quantity)*Number(p.market_price)*Number(p.fx_to_idr),0);
      const invested=(data.positions||[]).reduce((s,p)=>s+Number(p.quantity)*Number(p.average_cost)*Number(p.fx_to_idr),0);
      const unrealized=pricedPositions.reduce((s,p)=>s+(Number(p.market_price)-Number(p.average_cost))*Number(p.quantity)*Number(p.fx_to_idr),0);
      const realized=(data.transactions||[]).reduce((s,t)=>s+Number(t.realized_pnl_idr||0),0);
      const fees=(data.transactions||[]).reduce((s,t)=>s+Number(t.broker_fee_idr||0),0);
      const allocated=(data.allocations||[]).reduce((s,a)=>s+Number(a.amount_idr||0),0);
      return {capital,value,invested,unrealized,realized,fees,allocated,activeInvestors,pricedCount:pricedPositions.length,unpricedCount};
    }
    const metric=(label,value,foot,icon='◈',tone='')=>`<div class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><div class="metric-value ${tone}">${value}</div><div class="metric-foot">${foot}</div></div>`;
    function chartSvg(){
      const rows=data.snapshots||[];if(rows.length<2)return `<div style="height:210px;display:grid;place-items:center;color:#7f91a7;font-size:11px;text-align:center">Belum ada riwayat pertumbuhan aset.<br>Catat nilai portofolio secara berkala untuk membentuk grafik pertumbuhan.</div>`;
      const vals=rows.map(r=>Number(r.portfolio_value_idr));const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;const W=680,H=190,L=10,R=12,T=15,B=30;const pts=vals.map((v,i)=>`${L+i*(W-L-R)/(vals.length-1)},${T+(max-v)/range*(H-T-B)}`).join(' ');const area=`${L},${H-B} ${pts} ${W-R},${H-B}`;
      const labels=rows.map((r,i)=>i===0||i===rows.length-1||i===Math.floor(rows.length/2)?`<text x="${L+i*(W-L-R)/(rows.length-1)}" y="${H-4}" class="chart-label" text-anchor="middle">${dateFmt(r.snapshot_date).split(' ').slice(0,2).join(' ')}</text>`:'').join('');
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a66b" stop-opacity=".25"/><stop offset="1" stop-color="#c9a66b" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75].map(y=>`<line x1="${L}" y1="${T+(H-T-B)*y}" x2="${W-R}" y2="${T+(H-T-B)*y}" class="chart-grid"/>`).join('')}<polygon points="${area}" class="chart-area-fill"/><polyline points="${pts}" class="chart-line"/>${labels}</svg>`;
    }
    function allocBreakdown(){
      const v=[{key:'IDX',name:'Saham Indonesia',color:'#c9a66b'},{key:'US',name:'Saham Amerika',color:'#82b8e6'},{key:'CRYPTO',name:'Aset Kripto',color:'#a99ae8'}];const priced=(data.positions||[]).filter(p=>p.market_price!==null&&p.market_price!==undefined&&Number(p.market_price)>0);const total=priced.reduce((s,p)=>s+Number(p.quantity)*Number(p.market_price)*Number(p.fx_to_idr),0);
      if(total<=0)return `<div class="table-empty">Alokasi berdasarkan nilai pasar belum tersedia karena harga pasar posisi belum diisi.</div>`;
      return `<div class="alloc-list">${v.map(x=>{const amount=priced.filter(p=>p.market===x.key).reduce((s,p)=>s+Number(p.quantity)*Number(p.market_price)*Number(p.fx_to_idr),0),pct=amount/total*100;return `<div class="alloc-row"><div class="alloc-name"><span class="legend-dot" style="background:${x.color}"></span>${x.name}</div><div class="alloc-val">${pct.toFixed(1)}%</div><div class="track"><span style="width:${pct}%;background:${x.color}"></span></div></div>`}).join('')}</div>`;
    }
    function overviewPage(){
      const t=totals(), net=t.realized-t.fees, myPending=data.allocations.filter(a=>a.payment_status!=='paid').reduce((s,a)=>s+Number(a.amount_idr),0), admin=isAdmin();
      const metrics=admin?[
        metric('Market Value',t.pricedCount?money(t.value):'—',`${t.pricedCount} posisi memiliki harga pasar`,'◈'),
        metric('Total Diinvestasikan',t.invested?money(t.invested):'—','Kuantitas × average cost','↗'),
        metric('Total Modal Bersih',t.capital?money(t.capital):'—','Akumulasi setoran dikurangi penarikan','↗'),
        metric('Unrealized P/L',t.pricedCount?money(t.unrealized):'—',t.pricedCount?`${t.pricedCount} posisi memiliki harga pasar`:'Menunggu harga pasar','⌁',t.unrealized>=0?'positive':'negative'),
        metric('Net Realized P/L',net?money(net):'—',`Broker fee ${money(t.fees)}`,'◉',net>=0?'positive':'negative')
      ].join(''):[
        metric('Modal Bersih Saya',t.capital?money(t.capital):'—','Setoran dikurangi penarikan','◈'),
        metric('Market Value',t.pricedCount?money(t.value):'—',`${t.pricedCount} posisi memiliki harga pasar`,'↗'),
        metric('Total Diinvestasikan',t.invested?money(t.invested):'—','Kuantitas × average cost','◈'),
        metric('Unrealized P/L',t.pricedCount?money(t.unrealized):'—',t.pricedCount?`${t.pricedCount} posisi memiliki harga pasar`:'Menunggu harga pasar','⌁',t.unrealized>=0?'positive':'negative'),
        metric('Bagi Hasil Belum Dibayar',myPending?money(myPending):'—','Sesuai alokasi yang diterbitkan','◉')
      ].join('');
      const recent=(data.transactions||[]).slice(0,6);
      return `<div class="grid metrics">${metrics}</div><div class="grid columns"><section class="card"><div class="card-head"><div><h3>Pertumbuhan Aset</h3><div class="card-sub">Perkembangan total nilai pasar portofolio dari waktu ke waktu</div></div><div class="toolbar"><span class="tag draft">${data.snapshots.length} TITIK DATA</span>${isAdmin()?'<button class="btn ghost small-btn" id="add-snapshot">＋ Catat Nilai</button>':''}</div></div><div class="chart-area">${chartSvg()}</div></section><section class="card"><div class="card-head"><div><h3>Asset Allocation</h3><div class="card-sub">Komposisi nilai posisi saat ini</div></div></div>${allocBreakdown()}</section></div><section class="card"><div class="card-head"><div><h3>Recent Transactions</h3><div class="card-sub">Aktivitas transaksi terbaru</div></div><button class="btn ghost small-btn" data-page="transactions">Lihat semua</button></div>${transactionTable(recent)}</section>${admin?`<div class="grid two-col" style="margin-top:15px"><section class="card"><div class="card-head"><div><h3>Investor Overview</h3><div class="card-sub">Akun investor aktif</div></div><span class="tag active">${t.activeInvestors.length} ACTIVE</span></div><div style="font:800 24px Manrope;margin:8px 0">${t.activeInvestors.length}</div><div class="muted small">Investor aktif dalam sistem</div></section><section class="card"><div class="card-head"><div><h3>Profit Sharing Pool</h3><div class="card-sub">Total alokasi yang tercatat</div></div></div><div style="font:800 24px Manrope;color:var(--gold2);margin:8px 0">${money(t.allocated)}</div><div class="muted small">Alokasi investor dari distribusi yang dibuat</div></section></div>`:''}`;
    }
    function transactionTable(rows){
      if(!rows.length)return `<div class="table-empty">Belum ada transaksi yang dicatat.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>TANGGAL</th><th>INVESTOR</th><th>INSTRUMEN</th><th>PASAR</th><th>AKSI</th><th>KUANTITAS</th><th>HARGA PEMBELIAN</th><th>NILAI TRANSAKSI</th><th>MARKET PRICE TERKINI</th><th>NILAI MARKET POSISI</th><th>BROKER FEE</th><th>REALIZED P/L</th>${isAdmin()?'<th>AKSI</th>':''}</tr></thead><tbody>${rows.map(r=>{const p=(data.positions||[]).find(x=>x.market===r.market&&String(x.symbol||'').toUpperCase()===String(r.symbol||'').toUpperCase()&&(x.investor_id||null)===(r.investor_id||null));const hasMarket=p&&p.market_price!==null&&p.market_price!==undefined&&Number(p.market_price)>0;const marketValue=hasMarket?Number(p.quantity)*Number(p.market_price)*Number(p.fx_to_idr):null;return `<tr><td>${dateFmt(r.trade_date)}</td><td>${(()=>{const inv=(data.investors||[]).find(i=>i.id===r.investor_id);return inv?`<div class="symbol">${esc(inv.full_name||"Investor")}</div><div class="subsymbol">${esc(inv.investor_code||"")}</div>`:`<div class="symbol">Portofolio Bersama</div><div class="subsymbol">Belum dialokasikan ke investor</div>`})()}</td><td><div class="symbol">${esc(r.symbol)}</div><div class="subsymbol">${esc(r.asset_name||'')}</div></td><td>${marketTag(r.market)}</td><td><span class="tag ${r.side==='BUY'?'buy':'sell'}">${r.side}</span></td><td>${num(r.quantity)}</td><td>${num(r.unit_price)} ${esc(r.currency||'')}</td><td>${money(Number(r.quantity)*Number(r.unit_price)*Number(r.fx_to_idr))}</td><td>${hasMarket?num(p.market_price)+' '+esc(p.currency||''):'Belum diatur'}</td><td>${marketValue===null?'—':money(marketValue)}</td><td>${money(r.broker_fee_idr)}</td><td class="${Number(r.realized_pnl_idr)>=0?'positive':'negative'}">${money(r.realized_pnl_idr)}</td>${isAdmin()?`<td><button class="btn ghost small-btn" data-transaction-edit="${r.id}">Edit</button> <button class="btn danger small-btn" data-transaction-delete="${r.id}">Hapus</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`;
    }
    const marketTag=m=>`<span class="tag ${m==='IDX'?'idx':m==='US'?'us':'crypto'}">${m==='IDX'?'BEI':m==='US'?'US STOCK':'CRYPTO'}</span>`;
    async function refreshMarketPrices(){
      const button=document.querySelector('#refresh-market-prices');
      if(button){button.disabled=true;button.textContent='Memperbarui...';}
      try{
        const {data:out,error}=await supabase.functions.invoke('aai-market-prices',{body:{action:'sync'}});
        if(error)throw error;
        if(out?.error)throw new Error(out.error);
        await loadData();
        renderApp();
        notify(out?.message||'Harga saham berhasil disinkronkan.');
        if(out?.errors?.length)notify(out.errors.map(x=>x.symbol+': '+x.error).join(' · '),true);
      }catch(error){
        notify(error instanceof Error?error.message:'Gagal memperbarui harga saham.',true);
      }finally{
        const current=document.querySelector('#refresh-market-prices');
        if(current){current.disabled=false;current.textContent='↻ Sinkronkan Harga BEI';}
      }
    }
    function portfolioPage(){
      const source=data.positions||[];
      let rows=source.map((p,i)=>({...p,_firstIndex:i,_members:[p]}));
      if(isAdmin()){
        const grouped=new Map();
        source.forEach((p,i)=>{
          const key=[p.market,String(p.symbol||'').trim().toUpperCase(),p.currency].join('|');
          let g=grouped.get(key);
          if(!g){g={...p,_firstIndex:i,_members:[],quantity:0,_investedLocal:0,_investedIdr:0,_marketValue:0,_allPriced:true,_dates:[]};grouped.set(key,g);}
          const qty=Number(p.quantity||0),avg=Number(p.average_cost||0),fx=Number(p.fx_to_idr||1),price=Number(p.market_price||0);
          g._members.push(p);g.quantity+=qty;g._investedLocal+=qty*avg;g._investedIdr+=qty*avg*fx;
          if(p.market_price!==null&&p.market_price!==undefined&&price>0)g._marketValue+=qty*price*fx;else g._allPriced=false;
          if(p.valuation_date)g._dates.push(p.valuation_date);
        });
        rows=Array.from(grouped.values()).map(g=>({...g,average_cost:g.quantity?g._investedLocal/g.quantity:0,market_price:g._allPriced?Number(g.market_price):null,valuation_date:g._dates.sort().slice(-1)[0]||null}));
      }
      const prepared=rows.map(p=>{
        const hasPrice=isAdmin()?p._allPriced:(p.market_price!==null&&p.market_price!==undefined&&Number(p.market_price)>0);
        const invested=isAdmin()?p._investedIdr:Number(p.quantity)*Number(p.average_cost)*Number(p.fx_to_idr);
        const marketValue=hasPrice?(isAdmin()?p._marketValue:Number(p.quantity)*Number(p.market_price)*Number(p.fx_to_idr)):null;
        return {...p,_hasPrice:hasPrice,_invested:invested,_marketValue:marketValue,_pl:hasPrice?marketValue-invested:null};
      });
      const totalInvested=prepared.reduce((s,p)=>s+p._invested,0);
      const priced=prepared.filter(p=>p._hasPrice);
      const totalValue=priced.reduce((s,p)=>s+p._marketValue,0);
      const totalPl=priced.length===prepared.length?totalValue-totalInvested:null;
      return `<div class="page-head"><div><h2>Portofolio</h2><p>${isAdmin()?'Ringkasan seluruh kepemilikan perusahaan.':'Ringkasan aset dari transaksi akun Anda.'}</p></div>${isAdmin()?'<button class="btn ghost small-btn" id="refresh-market-prices">↻ Sinkronkan Harga BEI</button>':''}</div>
        <div class="grid metrics portfolio-metrics">
          ${metric('Nilai Pasar',priced.length?money(totalValue):'—',priced.length+' dari '+prepared.length+' aset memiliki harga','◈')}
          ${metric('Total Diinvestasikan',money(totalInvested),'Akumulasi modal pada posisi aktif','↗')}
          ${metric('Unrealized P/L',totalPl===null?'—':money(totalPl),totalPl===null?'Lengkapi harga pasar seluruh aset':'Selisih nilai pasar dan modal','⌁',totalPl===null?'':totalPl>=0?'positive':'negative')}
        </div>
        <div class="portfolio-list">
          ${prepared.length?prepared.map(p=>`<section class="card portfolio-item">

    function transactionsPage(){

    function investorsPage(){return `<div class="page-head"><div><h2>Investor Relations</h2><p>Kelola akun, modal investor, serta akses portal pribadi.</p></div><button class="btn" data-modal="investor">＋ Undang Investor</button></div><div class="grid metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('Investor Terdaftar',data.investors.filter(x=>x.role==='investor').length,'Semua akun investor','♙')}${metric('Investor Aktif',data.investors.filter(x=>x.role==='investor'&&x.status==='active').length,'Memiliki akses portal','✓')}${metric('Total Modal Bersih',money(totals().capital),'Setoran dikurangi penarikan','◈')}</div><section class="card"><div class="card-head"><div><h3>Investor Directory</h3><div class="card-sub">Daftar investor terdaftar di AAI</div></div></div>${investorTable()}</section><section class="card" style="margin-top:15px"><div class="card-head"><div><h3>Capital Movements</h3><div class="card-sub">Pencatatan setoran dan penarikan modal terbaru</div></div></div>${capitalTable(data.capital.slice(0,12))}</section>`}
    function capitalTable(rows){
      if(!rows.length)return '<div class="table-empty">Belum ada pergerakan modal.</div>';
      return '<div class="table-wrap"><table><thead><tr><th>TANGGAL</th><th>INVESTOR</th><th>JENIS</th><th>NILAI</th><th>REFERENSI</th><th>CATATAN</th><th>AKSI</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td>'+dateFmt(r.movement_date)+'</td><td>'+esc(data.investors.find(i=>i.id===r.investor_id)?.full_name||'Investor')+'</td><td><span class="tag '+(r.movement_type==='deposit'?'buy':'sell')+'">'+(r.movement_type==='deposit'?'SETORAN':'PENARIKAN')+'</span></td><td>'+money(r.amount_idr)+'</td><td>'+esc(r.reference_no||'—')+'</td><td>'+esc(r.notes||'—')+'</td><td>'+(isAdmin()&&r.movement_type==='deposit'?'<button class="btn ghost small-btn" data-capital-edit="'+r.id+'">Edit</button> <button class="btn ghost small-btn" data-capital-delete="'+r.id+'">Hapus</button>':'—')+'</td></tr>').join('')+

    function distributionPage(){
      const admin=isAdmin();const rows=admin?data.distributions:data.allocations;
      return `<div class="page-head"><div><h2>Profit Sharing</h2><p>Setiap investor dihitung dari portofolionya sendiri. Keuntungan bersih dibagi 50% untuk investor dan 50% untuk AAI.</p></div>${admin?'<button class="btn" data-modal="distribution">＋ Buat Distribusi</button>':''}</div><div class="callout" style="margin-bottom:15px"><strong>Formula per investor:</strong> Realized P/L + dividen bersih − seluruh broker fee pada periode = keuntungan bersih portofolio. Keuntungan positif dibagi 50% untuk investor dan 50% untuk AAI. Unrealized P/L tidak dibagikan. Modal bersih akhir periode hanya dicatat sebagai informasi, bukan dasar pembagian. Tidak ada penggabungan keuntungan antar-investor.</div><section class="card"><div class="card-head"><div><h3>${admin?'Distribution History':'My Profit Allocations'}</h3><div class="card-sub">${admin?'Distribusi yang dihitung dan status persetujuannya':'Alokasi yang menjadi hak akun Anda'}</div></div></div>${admin?distributionTable(rows):allocationTable(rows)}</section>`;
    }
    function distributionTable(rows){if(!rows.length)return `<div class="table-empty">Belum ada distribusi bagi hasil.</div>`;return `<div class="table-wrap"><table><thead><tr><th>INVESTOR</th><th>PERIODE</th><th>REALIZED P/L</th><th>DIVIDEN BERSIH</th><th>BROKER FEE</th><th>NET PROFIT</th><th>HAK INVESTOR (50%)</th><th>HAK AAI (50%)</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody>${rows.map(r=>{const investor=(data.investors||[]).find(p=>p.id===r.investor_id);return `<tr><td>${investor?esc(investor.full_name):'Distribusi lama / gabungan'}</td><td>${dateFmt(r.period_start)} – ${dateFmt(r.period_end)}</td><td>${money(r.realized_profit_idr)}</td><td>${money(r.dividend_income_idr||0)}</td><td>${money(r.broker_fees_idr)}</td><td>${money(r.net_profit_idr)}</td><td class="positive">${money(r.investor_pool_idr)}</td><td class="gold">${money(r.company_pool_idr)}</td><td><span class="tag ${r.status==='paid'?'paid':r.status==='approved'?'active':'draft'}">${esc(r.status.toUpperCase())}</span></td><td>${r.status==='draft'?`<button class="btn ghost small-btn" data-diststatus="${r.id}" data-next="approved">Approve</button>`:r.status==='approved'?`<button class="btn small-btn" data-diststatus="${r.id}" data-next="paid">Tandai Paid</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`}
    function allocationTable(rows){if(!rows.length)return `<div class="table-empty">Belum ada pembagian hasil yang diterbitkan untuk akun Anda.</div>`;return `<div class="table-wrap"><table><thead><tr><th>PERIODE</th><th>MODAL BERSIH AKHIR PERIODE</th><th>PORSI INVESTOR</th><th>HAK BAGI HASIL</th><th>STATUS BAYAR</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${a.period_start?dateFmt(a.period_start)+' – '+dateFmt(a.period_end):'Distribusi AAI'}</td><td>${money(a.capital_basis_idr)}</td><td>${Number(a.investor_share_pct??50).toFixed(2)}%</td><td class="positive">${money(a.amount_idr)}</td><td><span class="tag ${a.payment_status==='paid'?'paid':'pending'}">${a.payment_status.toUpperCase()}</span></td></tr>`).join('')}</tbody></table></div>`}
    function dividendsPage(){
      const rows=data.dividends||[];
      return `<div class="page-head"><div><h2>Dividend Ledger</h2><p>Catatan dividen saham Indonesia dan Amerika, termasuk pajak dan biaya.</p></div>${isAdmin()?'<button class="btn" data-modal="dividend">＋ Catat Dividen</button>':''}</div><section class="card">${rows.length?`<div class="table-wrap"><table><thead><tr><th>TANGGAL BAYAR</th><th>ASET</th><th>PASAR</th><th>QTY HAK</th><th>DIVIDEN/UNIT</th><th>BRUTO IDR</th><th>PAJAK</th><th>BIAYA</th><th>BERSIH IDR</th></tr></thead><tbody>${rows.map(d=>`<tr><td>${dateFmt(d.payment_date)}</td><td><div class="symbol">${esc(d.symbol)}</div><div class="subsymbol">${esc(d.asset_name||'')}</div></td><td>${marketTag(d.market)}</td><td>${num(d.quantity_eligible)}</td><td>${num(d.dividend_per_unit)} ${esc(d.currency)}</td><td>${money(d.gross_amount_idr)}</td><td>${money(d.tax_amount_idr)}</td><td>${money(d.fees_idr)}</td><td class="positive">${money(d.net_amount_idr)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="table-empty">Belum ada dividen yang dicatat.</div>`}</section><div class="notice" style="margin-top:14px">Nilai bersih dividen dihitung otomatis: bruto − pajak − biaya. Pencatatan dividen terpisah dari laba transaksi jual agar tidak terjadi penghitungan ganda.</div>`;
    }
    function documentsPage(){return `<div class="page-head"><div><h2>Documents & Statements</h2><p>Laporan dan dokumen investasi yang disimpan secara privat.</p></div>${isAdmin()?'<button class="btn" data-modal="document">＋ Upload PDF</button>':''}</div><section class="card">${data.documents.length?`<div class="table-wrap"><table><thead><tr><th>DOKUMEN</th><th>INVESTOR</th><th>PERIODE</th><th>TIPE</th><th>TANGGAL</th><th>AKSI</th></tr></thead><tbody>${data.documents.map(d=>`<tr><td><div class="symbol">${esc(d.title)}</div><div class="subsymbol">PDF document</div></td><td>${esc(data.investors.find(i=>i.id===d.investor_id)?.full_name||'Me')}</td><td>${d.period_start?dateFmt(d.period_start)+' – '+dateFmt(d.period_end):'—'}</td><td>${esc(d.document_type)}</td><td>${dateFmt(d.created_at?.slice(0,10))}</td><td><button class="btn ghost small-btn" data-download="${d.id}">Unduh</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="table-empty">Belum ada dokumen yang tersedia.</div>`}</section><div class="notice" style="margin-top:14px">Dokumen disimpan di bucket privat Supabase Storage. Tautan unduhan dibuat sementara setelah sesi login diverifikasi.</div>`}
    function profilePage(){return `<div class="page-head"><div><h2>My Account</h2><p>Informasi akun portal AAI Anda.</p></div></div><section class="card"><div class="profile-card"><div class="avatar">${initials(profile.full_name)}</div><div><div class="symbol">${esc(profile.full_name)}</div><div class="subsymbol">${esc(profile.email)}</div></div><span class="tag active" style="margin-left:auto">${esc(profile.role.toUpperCase())}</span></div><div class="grid two-col" style="margin-top:16px"><div><div class="muted small">Investor code</div><strong>${esc(profile.investor_code||'Belum ditetapkan')}</strong></div><div><div class="muted small">Status akun</div><strong>${esc(profile.status)}</strong></div><div><div class="muted small">Tanggal terdaftar</div><strong>${dateFmt(profile.created_at?.slice(0,10))}</strong></div><div><div class="muted small">Email</div><strong>${esc(profile.email)}</strong></div></div><div style="margin-top:18px"><button class="btn secondary" id="reset-password">Kirim tautan reset password</button></div></section>`}
    function getTheme(){try{return localStorage.getItem('aai-theme')||'dark'}catch(e){return 'dark'}}
    function applyTheme(theme){const chosen=theme==='light'?'light':'dark';document.documentElement.dataset.theme=chosen;try{localStorage.setItem('aai-theme',chosen)}catch(e){}}
    applyTheme(getTheme());
    function renderApp(){
      const navItems=[['overview','◫','Overview'],['portfolio','◈','Portfolio'],['transactions','⇄','Transactions'],['dividends','＄','Dividends'],...(isAdmin()?[['investors','♙','Investors']]:[]),['distributions','％','Profit Sharing'],['documents','▤','Documents'],['profile','○','My Account']];
      if(!navItems.some(x=>x[0]===activePage))activePage='overview';
      const pageContent=({overview:overviewPage,portfolio:portfolioPage,transactions:transactionsPage,dividends:dividendsPage,investors:investorsPage,distributions:distributionPage,documents:documentsPage,profile:profilePage})[activePage]();
      root.innerHTML=`<div class="app"><aside class="sidebar"><div class="side-brand"><div class="brand-mark">AAI</div><div><strong>ADHINATHA AMANAH</strong><span>PRIVATE INVESTMENT OFFICE</span></div></div><button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="side-menu" aria-label="Buka menu navigasi"><span class="bars" aria-hidden="true"></span><span>Menu</span></button><div class="nav-wrap" id="side-menu"><div class="nav-label">WORKSPACE</div><nav class="nav">${navItems.map(([id,ico,label])=>`<button data-page="${id}" class="${activePage===id?'active':''}"><span class="nav-icon">${ico}</span>${label}</button>`).join('')}</nav></div><div class="side-bottom"><div class="user-chip"><div class="avatar">${initials(profile.full_name)}</div><div style="min-width:0"><strong>${esc(profile.full_name)}</strong><small>${isAdmin()?'Administrator':'Investor account'}</small></div></div><button class="btn ghost small-btn" style="width:100%" id="signout">Keluar dari portal</button></div></aside><main class="main"><header class="topbar"><div><div class="breadcrumb">AAI / ${titleMap[activePage]}</div><h1>${titleMap[activePage]}</h1></div><div class="top-actions">${'<button type="button" class="btn ghost small-btn theme-toggle" id="theme-toggle" aria-label="Ganti ke mode terang" title="Ganti tema">☀️ <span>Terang</span></button>'}${!isAdmin()?'<button class="btn ghost small-btn" id="print-statement">Cetak ringkasan</button>':''}<span class="status-pill">● SECURE SESSION</span><span class="date-pill">${new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}</span></div></header><div id="page-content">${pageContent}</div></main></div>`;
      const themeBtn=root.querySelector('#theme-toggle');
      const syncThemeButton=()=>{const light=document.documentElement.dataset.theme==='light';themeBtn.innerHTML=light?'🌙 <span>Gelap</span>':'☀️ <span>Terang</span>';themeBtn.setAttribute('aria-label',light?'Ganti ke mode gelap':'Ganti ke mode terang');themeBtn.title=light?'Ganti ke mode gelap':'Ganti ke mode terang'};
      syncThemeButton();
      themeBtn.addEventListener('click',()=>{applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');syncThemeButton()});
      root.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{activePage=b.dataset.page;renderApp()}));
      const sidebar=root.querySelector('.sidebar'),menuBtn=root.querySelector('#menu-toggle');
      const setMenu=open=>{sidebar.classList.toggle('menu-open',open);menuBtn.setAttribute('aria-expanded',String(open));menuBtn.setAttribute('aria-label',open?'Tutup menu navigasi':'Buka menu navigasi')};
      menuBtn.addEventListener('click',()=>setMenu(!sidebar.classList.contains('menu-open')));
      sidebar.addEventListener('keydown',e=>{if(e.key==='Escape'&&sidebar.classList.contains('menu-open')){setMenu(false);menuBtn.focus()}});
      root.querySelector('#add-snapshot')?.addEventListener('click',recordSnapshot);
      root.querySelector('#print-statement')?.addEventListener('click',()=>window.print());
      root.querySelector('#signout').addEventListener('click',async()=>{await supabase.auth.signOut();currentUser=null;profile=null;renderAuth()});
      root.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.modal)));
      root.querySelectorAll('[data-investor-edit]').forEach(b=>b.addEventListener('click',()=>openModal('investor-edit',b.dataset.investorEdit)));
      root.querySelectorAll('[data-market-price]').forEach(b=>b.addEventListener('click',()=>openModal('market-price',b.dataset.marketPrice)));
      root.querySelector('#refresh-market-prices')?.addEventListener('click',refreshMarketPrices);
      root.querySelectorAll('[data-capital]').forEach(b=>b.addEventListener('click',()=>openModal('capital',b.dataset.capital)));
      root.querySelectorAll('[data-capital-edit]').forEach(b=>b.addEventListener('click',()=>openModal('capital-edit',b.dataset.capitalEdit)));
      root.querySelectorAll('[data-capital-delete]').forEach(b=>b.addEventListener('click',()=>deleteCapitalMovement(b.dataset.capitalDelete)));
      root.querySelectorAll('[data-transaction-edit]').forEach(b=>b.addEventListener('click',()=>openModal('transaction-edit',b.dataset.transactionEdit)));
      root.querySelectorAll('[data-transaction-delete]').forEach(b=>b.addEventListener('click',()=>deleteTransaction(b.dataset.transactionDelete)));
      root.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>toggleInvestorStatus(b.dataset.status,b.dataset.next)));
      root.querySelectorAll('[data-diststatus]').forEach(b=>b.addEventListener('click',()=>updateDistributionStatus(b.dataset.diststatus,b.dataset.next)));
      root.querySelectorAll('[data-download]').forEach(b=>b.addEventListener('click',()=>downloadDocument(b.dataset.download)));
      root.querySelector('#reset-password')?.addEventListener('click',async()=>{const {error}=await supabase.auth.resetPasswordForEmail(profile.email,{redirectTo:location.origin});if(error)notify(error.message,true);else notify('Tautan reset password telah dikirim ke email.')});
    }
    function selectInvestor(){return `<option value="">Pilih investor</option>${data.investors.filter(i=>i.role==='investor').map(i=>`<option value="${i.id}">${esc(i.full_name)} · ${esc(i.investor_code||i.email)}</option>`).join('')}`}

        capital:{title:'Catat Pergerakan Modal',desc:'Catat setoran atau penarikan modal investor.',body:`<input type="hidden" name="investor_id" value="${id}"><div class="field"><label>Jenis pergerakan</label><select name="movement_type"><option value="deposit">Setoran modal</option><option value="withdrawal">Penarikan modal</option></select></div><div class="field"><label>Nominal (IDR)</label><input name="amount_idr" type="number" min="1" step="1" required></div><div class="field"><label>Tanggal</label><input name="movement_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Nomor referensi</label><input name="reference_no"></div><div class="field"><label>Catatan</label><input name="notes"></div>`},

          const text=String(raw??'').replace(/[^0-9,.-]/g,'');

        };
        input.value=formatValue(input.value);

    async function submitModal(e,type){

        if(!Number.isFinite(v[input.name]))throw new Error('Format angka pada '+(input.name||'kolom')+' tidak valid.');

          const {error}=await supabase.from('portfolio_positions').upsert(payloads,{onConflict:'investor_id,market,symbol'});if(error)throw error;notify(isAdmin()?'Harga pasar saham berhasil diperbarui untuk seluruh kepemilikan.':'Market price berhasil diperbarui.');

        }else if(type==='capital'){

        }else if(type==='capital-edit'){
          const {error}=await supabase.from('investor_capital_movements').update({investor_id:v.investor_id,amount_idr:Number(v.amount_idr),movement_date:v.movement_date,reference_no:v.reference_no||null,notes:v.notes||null}).eq('id',v.movement_id).eq('movement_type','deposit');if(error)throw error;notify('Setoran modal berhasil diperbarui.');
        }else if(type==='position'){

      const r=data.capital.find(x=>x.id===id);if(!r||r.movement_type!=='deposit')return;
      if(!confirm('Hapus setoran modal ini? Total modal dan perhitungan alokasi bagi hasil dapat berubah. Tindakan ini tidak dapat dibatalkan.'))return;
      try{const {error}=await supabase.from('investor_capital_movements').delete().eq('id',id).eq('movement_type','deposit');if(error)throw error;notify('Setoran modal berhasil dihapus.');await loadData();renderApp()}catch(e){notify(e.message||'Gagal menghapus setoran.',true)}
    }
    async function recordSnapshot(){try{const priced=(data.positions||[]).filter(p=>p.market_price!==null&&p.market_price!==undefined&&Number(p.market_price)>0);if(priced.length!==(data.positions||[]).length){notify('Snapshot tidak dibuat: masih ada posisi tanpa harga pasar.',true);return;}const value=priced.reduce((sum,p)=>sum+Number(p.quantity)*Number(p.market_price)*Number(p.fx_to_idr),0);const today=new Date().toISOString().slice(0,10);const {error}=await supabase.from('portfolio_snapshots').upsert({snapshot_date:today,portfolio_value_idr:value,cash_balance_idr:0,notes:'Snapshot dari nilai posisi saat ini',created_by:currentUser.id},{onConflict:'snapshot_date'});if(error)throw error;notify('Snapshot valuasi berhasil disimpan.');await loadData();renderApp()}catch(e){notify(e.message,true)}}
    async function toggleInvestorStatus(id,next){try{const {error}=await supabase.from('profiles').update({status:next}).eq('id',id);if(error)throw error;notify('Status investor diperbarui.');await loadData();renderApp()}catch(e){notify(e.message,true)}}
    async function updateDistributionStatus(id,next){try{const {error}=await supabase.from('profit_distributions').update({status:next}).eq('id',id);if(error)throw error;if(next==='paid'){const {error:e2}=await supabase.from('profit_allocations').update({payment_status:'paid',paid_at:new Date().toISOString()}).eq('distribution_id',id);if(e2)throw e2;}notify('Status distribusi diperbarui.');await loadData();renderApp()}catch(e){notify(e.message,true)}}
    async function downloadDocument(id){const doc=data.documents.find(d=>d.id===id);if(!doc)return;const {data:out,error}=await supabase.storage.from('investor-documents').createSignedUrl(doc.storage_path,60);if(error){notify(error.message,true);return;}window.open(out.signedUrl,'_blank','noopener,noreferrer')}
    supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){currentUser=null;profile=null;if(authMode!=='login')authMode='login';renderAuth()}else if(event==='PASSWORD_RECOVERY'){authMode='update-password';currentUser=session?.user||null;renderAuth('Tautan reset berhasil diverifikasi. Silakan buat password baru.')}});
    const recoveryLink=new URLSearchParams(location.hash.replace(/^#/,'')).get('type')==='recovery';
    if(recoveryLink){authMode='update-password';renderAuth('Tautan reset terdeteksi. Silakan buat password baru.')}
    else{try{await refreshApp()}catch(e){renderAuth(e.message||'Aplikasi gagal terhubung ke Supabase.',true)}}
  </script>
</body>
</html>
